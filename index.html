<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Join Chatwave Meeting</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      font-family: sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f2f2f2;
    }

    .container {
      text-align: center;
    }

    button {
      padding: 16px 24px;
      font-size: 18px;
      background: #007aff;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin: 10px;
    }

    button:hover {
      background: #005fd1;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Join your meeting in Chatwave</h2>
    <button onclick="openUniversalLink()">Join via Universal Link</button>
    <button onclick="openCustomScheme()">Join via App Scheme</button>
    <button onclick="openAndroidIntent()">Join via Android App</button>
  </div>

  <script>
    function openUniversalLink() {
      const universalLink = "https://meet.cmedcc.com/id/8907845315?p=Y21lZGNjQDIwMjU4ODkxMDA=";
      const fallbackAppStoreLink = "https://apps.apple.com/us/app/chatwave/id6502752600";

      const fallbackTimeout = setTimeout(() => {
        window.location.href = fallbackAppStoreLink;
      }, 2000);

      window.location.href = universalLink;

      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === 'hidden') {
          clearTimeout(fallbackTimeout);
        }
      });
    }

    function openCustomScheme() {
      const customURL = "com.cmedcc.imapp://meeting?url=https://meet.cmedcc.com/id/8907845315?p=Y21lZGNjQDIwMjU4ODkxMDA=";
      const fallbackAppStoreLink = "https://apps.apple.com/us/app/chatwave/id6502752600";

      const fallbackTimeout = setTimeout(() => {
        window.location.href = fallbackAppStoreLink;
      }, 2000);

      window.location.href = customURL;

      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === 'hidden') {
          clearTimeout(fallbackTimeout);
        }
      });
    }

    function openAndroidIntent() {
      const intentURL = "intent://id/8907845315?p=Y21lZGNjQDIwMjU4ODkxMDA=#Intent;scheme=https;package=com.cmedcc.imapp;S.browser_fallback_url=https%3A%2F%2Fplay.google.com%2Fstore%2Fapps%2Fdetails%3Fid%3Dcom.cmedcc.imapp;end";

      window.location.href = intentURL;
    }
  </script>
</body>
</html>
