<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Universal Link Test</title>
  <style>
    button {
      display: block;
      margin: 10px 0;
      padding: 12px 18px;
      font-size: 16px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
    }
    .primary { background-color: #4CAF50; color: white; }
    .secondary { background-color: #2196F3; color: white; }
    .fallback { background-color: #f39c12; color: white; }
  </style>
</head>
<body>
  <h2>Universal Link Test</h2>

  <button class="primary" onclick="openApp('universal')">🔗 Open in App (Universal Link)</button>
  <button class="secondary" onclick="openApp('intent')">🚀 Force Open in App (Intent URL)</button>
  <button class="fallback" onclick="openApp('fallback')">🌐 Open in App or Fallback</button>
   <p>
    <a href="intent://meet.cmedcc.com/meeting?p=Y21lZGNjQDIwMjU4ODkxMDA%3D#Intent;scheme=https;package=com.cmedcc.im.app;end">
      🚀 Force Open in App (Intent URL)
    </a>
  </p>

  <script>
    const currentUrl = window.location.href;

    function openApp(type) {
      if (type === "universal") {
        window.location.href = currentUrl;
      } else if (type === "intent") {
        window.location.href =
          "intent://" +
          currentUrl.replace(/^https?:\/\//, "") +
          "#Intent;scheme=https;package=com.cmedcc.im.app;end";
      } else if (type === "fallback") {
        window.location.href =
          "intent://" +
          currentUrl.replace(/^https?:\/\//, "") +
          "#Intent;scheme=https;package=com.cmedcc.im.app;S.browser_fallback_url=" +
          encodeURIComponent(currentUrl) +
          ";end";
      }
    }
  </script>
</body>
</html>
