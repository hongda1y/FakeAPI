<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Open Chatwave Meeting</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      font-family: sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f2f2f2;
    }
    .message {
      font-size: 18px;
      color: #333;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>
<body>
  <div class="message">
    Opening your meeting in Chatwave...
  </div>

  <script>
    window.onload = function openChatwaveApp() {
      const universalLink = "https://meet.cmedcc.com/id/8907845315?p=Y21lZGNjQDIwMjU4ODkxMDA=";
      const fallbackAppStoreLink = "https://apps.apple.com/us/app/chatwave/id6502752600";

      const fallbackTimeout = setTimeout(() => {
        window.location.href = fallbackAppStoreLink;
      }, 2000);

      window.location.href = universalLink;

      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === 'hidden') {
          clearTimeout(fallbackTimeout);
        }
      });
    };
  </script>
</body>
</html>
